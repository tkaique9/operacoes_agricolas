# Render Blueprint: Web Service Node (server.js) que publica as páginas de public/ e guarda as
# alterações das páginas de escalas no branch "dados" do GitHub. Sem dependências: npm não é usado.
services:
  - type: web
    name: operacoes-agricolas
    runtime: node
    plan: free
    buildCommand: ./render-build.sh
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: tkaique9/operacoes_agricolas
      - key: GITHUB_BRANCH
        value: dados
