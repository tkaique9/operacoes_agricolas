<meta name="robots" content="noindex, nofollow">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* lista de trabalho da gerência: faixa azul-marinho da CRV no alto, um cartão por papel
   (necessidade × marcados) e a fila em tabela, colheita primeiro */
:root {
  --bg: #F4F6FA; --surface: #FFFFFF; --ink: #1C2433; --mut: #5A6072; --line: #D6DAE2; --zebra: #F8F9FC;
  --navy: #12224A; --band-ink: #F4F6FA; --band-mut: #AEBBD8;
  --gold: #A88516; --marc: #FDF2D3; --marc-line: #E9D48F; --azul: #2563A8; --azul-bg: #E3EEFA;
  --ok: #2E7D46; --ok-bg: #E2F1E6; --warn: #A6620A; --warn-bg: #FBEEDA; --bad: #C0392B; --bad-bg: #FAE1DD;
  --f-ui: "Archivo", "Segoe UI", -apple-system, Helvetica, Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A1330; --surface: #111C3D; --ink: #E8ECF5; --mut: #AEBBD8; --line: rgba(174,187,216,.22); --zebra: #14214A;
  --navy: #1E3566; --band-ink: #F4F6FA; --band-mut: #AEBBD8;
  --gold: #D9B43C; --marc: rgba(201,162,39,.16); --marc-line: rgba(201,162,39,.45); --azul: #8DB8F0; --azul-bg: rgba(37,99,168,.28);
  --ok: #8FD3A6; --ok-bg: rgba(46,125,70,.22); --warn: #F5A35C; --warn-bg: rgba(166,98,10,.22); --bad: #F0897A; --bad-bg: rgba(192,57,43,.22);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0A1330; --surface: #111C3D; --ink: #E8ECF5; --mut: #AEBBD8; --line: rgba(174,187,216,.22); --zebra: #14214A;
  --navy: #1E3566; --band-ink: #F4F6FA; --band-mut: #AEBBD8;
  --gold: #D9B43C; --marc: rgba(201,162,39,.16); --marc-line: rgba(201,162,39,.45); --azul: #8DB8F0; --azul-bg: rgba(37,99,168,.28);
  --ok: #8FD3A6; --ok-bg: rgba(46,125,70,.22); --warn: #F5A35C; --warn-bg: rgba(166,98,10,.22); --bad: #F0897A; --bad-bg: rgba(192,57,43,.22);
  color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--f-ui); }
.faixa { background: var(--navy); color: var(--band-ink); }
/* a página usa a largura toda da tela: as tabelas crescem com ela e o texto quebra em vez de rolar */
.lado { margin: 0 auto; padding-left: max(16px, 1.6vw, env(safe-area-inset-left, 0px)); padding-right: max(16px, 1.6vw, env(safe-area-inset-right, 0px)); }
.faixa .lado { padding-block: 22px 20px; display: grid; gap: 6px; }
.olho { font: 500 12px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--band-mut); }
h1 { margin: 0; font: 800 clamp(24px, 3.4vw, 34px)/1.1 var(--f-ui); letter-spacing: -.02em; text-wrap: balance; }
.faixa p { margin: 0; color: var(--band-mut); max-width: 78ch; }
.priv { display: inline-flex; gap: 6px; align-items: center; font: 600 12px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--navy); background: #E9D48F; border-radius: 3px; padding: 3px 8px; justify-self: start; }
main.lado { padding-block: 18px 40px; display: grid; gap: 18px; }
/* tabela por papel, a mesma da página FAT do estudo: os números com nomes por trás são botões que filtram a lista */
.resumo { display: grid; gap: 8px; min-width: 0; }
.resumo h2 { margin: 0; font: 700 17px var(--f-ui); }
.resumo h2 small { font: 400 13.5px var(--f-ui); color: var(--mut); margin-left: 8px; }
table.res th { text-align: center; white-space: normal; vertical-align: bottom; line-height: 1.2; }
table.res th u { display: block; text-decoration: none; font: 400 11.5px var(--f-mono); opacity: .8; margin-top: 2px; }
table.res th.l, table.res td.l { text-align: left; }
table.res td { text-align: center; font: 700 18px var(--f-ui); font-variant-numeric: tabular-nums; padding: 7px 9px; }
table.res td.l { font: 700 15px var(--f-ui); }
table.res tr.tot td { background: var(--marc); border-top: 2px solid var(--navy); }
table.res th.cl { box-shadow: inset 0 -3px 0 var(--gold); }
button.nb { font: 700 18px var(--f-ui); font-variant-numeric: tabular-nums; color: var(--ink); background: none; border: 0; border-bottom: 2px dotted var(--gold); border-radius: 3px 3px 0 0; padding: 2px 10px; cursor: pointer; }
button.nb:hover { background: var(--marc); }
button.nb.on { background: var(--gold); color: var(--surface); border-bottom-color: var(--gold); }
table.res input { width: 84px; box-sizing: border-box; font: 700 18px var(--f-ui); font-variant-numeric: tabular-nums; text-align: center; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 3px 6px; }
.busca input:focus-visible, button:focus-visible, td input:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.nota { margin: 0; color: var(--mut); font-size: 13.5px; }
.barra { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.busca { flex: 1 1 260px; min-width: 0; }
.busca input { width: 100%; box-sizing: border-box; font: 500 15px var(--f-ui); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 9px 12px; }
button { font: 600 14px var(--f-ui); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 9px 14px; cursor: pointer; }
button.pri { background: var(--navy); color: var(--band-ink); border-color: var(--navy); }
button:hover { border-color: var(--gold); }
.aviso { font: 500 13px var(--f-ui); color: var(--ok); }
textarea.copia { width: 100%; box-sizing: border-box; min-height: 120px; font: 400 12.5px var(--f-mono); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 8px; }
section.papel { display: grid; gap: 8px; min-width: 0; }
section.papel h3 { margin: 0; font: 700 19px var(--f-ui); }
section.papel h3 small { font: 500 13px var(--f-mono); color: var(--mut); margin-left: 8px; }
.rolo { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
th { background: var(--navy); color: var(--band-ink); font: 600 12.5px var(--f-ui); text-align: left; padding: 8px 9px; white-space: nowrap; }
td { padding: 6px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.nome { white-space: normal; min-width: 150px; font-weight: 600; }
/* na fila, função, atividade, gerência e a turma quebram linha: a tabela cabe na largura da tela */
section.papel td.t { white-space: normal; min-width: 90px; }
section.papel td.fe-c { white-space: normal; min-width: 190px; }
section.papel td.fe-c .fe { white-space: normal; }
section.papel th { white-space: normal; vertical-align: bottom; }
section.papel td { padding: 6px 8px; }
td.c, th.c { text-align: center; } td.n, th.n { text-align: right; }
td.mono { font: 500 13px var(--f-mono); }
tbody tr:nth-child(even) td { background: var(--zebra); }
tr.grp td { background: var(--bg) !important; font: 600 12px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mut); padding-top: 12px; }
tr.vai td { background: var(--marc) !important; }
tr.vai td:first-child { box-shadow: inset 4px 0 0 var(--gold); }
/* sugeridos para completar a necessidade (não estão na lista do Transporte): azul */
tr.vai.sug td { background: var(--azul-bg) !important; }
tr.vai.sug td:first-child { box-shadow: inset 4px 0 0 var(--azul); }
.orig { display: inline-block; font: 600 10.5px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; border-radius: 3px; padding: 1px 5px; margin-left: 6px; vertical-align: 1px; }
.orig.esc { color: var(--band-ink); background: var(--navy); } .orig.sug { color: #fff; background: var(--azul); }
table.res td small.sg { display: block; font: 600 11px var(--f-mono); color: var(--azul); margin-top: 1px; }
td input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--navy); cursor: pointer; }
.troca { font: 600 11px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--warn); margin-left: 6px; }
/* férias: a cor diz quando o limite cai (entressafra, safra de 2027 ou depois) */
.fe { display: inline-block; font: 600 12.5px var(--f-ui); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.fe.f1 { color: var(--bad); background: var(--bad-bg); } .fe.f2 { color: var(--warn); background: var(--warn-bg); }
.fe.f3 { color: var(--ok); background: var(--ok-bg); } .fe.f0 { color: var(--mut); background: var(--bg); }
.lei { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--gold); border-radius: 4px; padding: 12px 16px; display: grid; gap: 6px; }
.lei h2 { margin: 0; font: 700 16px var(--f-ui); }
.lei p { margin: 0; max-width: 110ch; }
/* filtros da lista, como o filtro do Excel: cada lista mostra só os valores que sobram com os outros filtros */
.filtros { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; display: grid; gap: 12px; min-width: 0; }
.f-linha { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.f-linha .busca { grid-column: span 2; }
.f-linha label { display: block; font: 500 11.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--mut); margin-bottom: 4px; }
.f select { width: 100%; box-sizing: border-box; font: 500 14px var(--f-ui); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 8px; }
.f select.ativo { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.f select:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.conta { font: 600 14px var(--f-ui); margin-right: auto; }
@media (max-width: 560px) { .f-linha .busca { grid-column: auto; } }
@media (prefers-reduced-motion: no-preference) { tr td { transition: background-color .15s ease; } }
/* impressão e PDF: folha deitada, só a lista que está na tela (com os filtros), sem os controles */
.so-imp { display: none; }
@media print {
  tr.vai.sug td { background: #E3EEFA !important; }
  @page { size: A4 landscape; margin: 10mm; }
  :root { --bg: #fff; --surface: #fff; --ink: #000; --mut: #333; --line: #bbb; --zebra: #f3f4f7; --marc: #fdf2d3; }
  body { font-size: 10px; background: #fff; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .lado { padding: 0 !important; }
  .faixa .lado { padding-block: 6px !important; }
  .faixa p, .priv, .lei, #criterio, .filtros, .copia, .resumo .nota, .resumo h2 small, .troca { display: none !important; }
  .so-imp { display: block; margin: 0; font: 600 11px var(--f-ui); }
  main.lado { gap: 8px; padding-block: 6px 0; }
  h1 { font-size: 18px; }
  .rolo { overflow: visible; border: 0; }
  table { font-size: 9.5px; }
  th, td { padding: 3px 4px !important; }
  table.res td, button.nb, table.res input { font-size: 11px; }
  table.res input { border: 0; width: auto; padding: 0; }
  button.nb { border: 0; padding: 0; }
  section.papel td.fe-c { min-width: 0; }
  .fe { font-size: 9px; padding: 1px 5px; }
  td input[type=checkbox] { width: 11px; height: 11px; }
  tr { break-inside: avoid; }
  thead { display: table-header-group; }
  section.papel h3 { font-size: 13px; break-after: avoid; }
}
</style>

<div class="faixa" translate="no"><div class="lado">
  <div class="olho">CRV Industrial · Escalas EC 141/2026 · FAT</div>
  <h1>Quem vai para o FAT</h1>

</div></div>

<main class="lado" translate="no">

      <div class="f"><label for="f-fer">Férias</label><select id="f-fer" data-k="fer"></select></div>

      <button type="button" id="bLimpa">Limpar filtros</button>
      <button type="button" id="bCopiaF">Copiar a lista filtrada</button>
      <button type="button" id="bXls">Exportar para Excel</button>
      <button type="button" id="bImp">Imprimir ou PDF</button>
      <button type="button" id="bSug">Voltar à sugestão</button>
      <button type="button" class="pri" id="bCopia">Copiar marcados</button>
    </div>
    <span class="aviso" id="aviso" role="status"></span>
  </section>
  <p class="so-imp" id="impFiltro"></p>
  <textarea class="copia" id="copia" hidden readonly aria-label="Lista dos marcados para copiar"></textarea>
  <div id="listas"></div>
</main>

    COLS_RES.map(([s, a, b]) => `<th${s === "vai" ? ' class="cl"' : s === "sug" ? ' class="az"' : ""}>${a}${b ? `<u>${b}</u>` : ""}</th>`).join("") + `</tr></thead><tbody>`;
  lin.forEach(l => {
    h += `<tr><td class="l">${ROT[l.p]}</td><td>${l.at || "–"}</td><td>${l.at ? l.pr : "–"}</td>` +
      `<td><input id="nec-${l.p}" type="number" min="0" step="1" inputmode="numeric" value="${l.n}" data-p="${l.p}" aria-label="Necessidade do FAT, ${ROT[l.p].toLowerCase()}"></td>` +
      COLS_RES.map(([s]) => `<td>${bot(l.p, s, l[s], l)}</td>`).join("") + `</tr>`;
  });
  h += `<tr class="tot"><td class="l">Total</td><td>${tot.at || "–"}</td><td>${tot.at ? tot.pr : "–"}</td><td>${tot.n}</td>` +
    COLS_RES.map(([s]) => `<td>${bot("", s, tot[s], tot)}</td>`).join("") + `</tr></tbody>`;
  $("resumo").innerHTML = h;
  // o que fecha e o que falta em cada papel
  const saf = p => Math.min(LIVRES.filter(x => x.papel === p && x.sit === "livre" && x.contrato === "Safra").length, lin.find(l => l.p === p).semfat);
  $("notaRes").textContent = lin.map(l => {
    const r = ROT[l.p].toLowerCase(), sf = saf(l.p);
    if (l.vai > l.n) return `${ROT[l.p]}: ${l.vai - l.n} marcados a mais que os sem escala.`;
    return `${ROT[l.p]}: sobram ${l.semfat} sem escala e sem FAT` + (sf ? `, ${sf} de contrato safra (saem no fim da safra; ficam ${l.semfat - sf})` : "") + "." +
      (cobre(l.p) ? ` ${cobre(l.p)} ${r} livres entram nas vagas da oficina${falta(l.p) ? ` (faltam ${falta(l.p)})` : ""}.` : "");
  }).join(" ");
  marcaBotoes();
}
function listas() {
  $("listas").innerHTML = PAP.map(p => {
    const g = dos(p);
    let h = `<section class="papel"><h3>${ROT[p]}<small>fila do FAT · ${g.length} com direito</small></h3><div class="rolo"><table><thead><tr>
      <th class="c">Vai</th><th class="n">Fila</th><th>Mat.</th><th>Nome</th><th>Função</th><th>Atividade</th><th>Gerência</th>
      <th class="c">Admissão</th><th class="c">Tempo</th><th class="n">Idade</th><th>Férias</th><th class="c">Limite férias</th><th>Férias e FAT</th></tr></thead><tbody>`;
    let grupo = 0;
    g.forEach((x, i) => {
      if (grupoDe(x) !== grupo) { grupo = grupoDe(x); h += `<tr class="grp"><td colspan="13">${GRUPO[grupo]} · ${g.filter(y => grupoDe(y) === grupo).length}</td></tr>`; }
      h += `<tr ${dadosLinha(x, sitDe(x))}><td class="c"><input type="checkbox" aria-label="${esc(x.nome)} vai para o FAT" data-mat="${x.mat}"></td>
        <td class="n mono">${i + 1}</td><td class="mono">${x.mat}</td><td class="nome">${esc(x.nome)}<span class="orig" hidden></span><span class="troca" hidden>trocado</span></td>
        <td class="t">${esc(x.funcao)}</td><td class="t">${esc(x.ativ)}</td><td class="t">${esc(x.ger)}</td><td class="c mono">${dataBR(x.adm)}</td>
        <td class="c">${esc(x.tempo)}</td><td class="n">${x.idade == null ? "–" : x.idade}</td>
        <td>${esc(x.ferias)}</td><td class="c mono" title="fonte: ${esc(x.fonte_ferias || "painel")}">${dataBR(x.limite)}</td><td class="fe-c"></td></tr>`;
    });
    return h + "</tbody></table></div></section>";
  }).join("") + semEscala() + verificar();
}
// quem não está na escala do Transporte nem no FAT, com o motivo: os operadores entram nas vagas da oficina; os outros
// sobram sem escala e sem FAT
const MOTIVO_LV = { safra: "Contrato safra · sai no fim da safra", experiencia: "Em experiência · sem direito", efetivo: "Efetivo com menos de 12 meses",
  conferir: "Direito a conferir (possível aposentado)", fat_fora: "Marcado FAT no cadastro, fora da programação", op_fora: "Marcado em operação no cadastro, fora da escala" };
function semEscala() {
  if (!LIVRES.length) return "";
  let h = `<section class="papel"><h3>Fora da escala e do FAT<small>${LIVRES.length} pessoas · relatório de ativos do Transporte</small></h3>
    <p class="nota">Quem não está na escala de dezembro nem nos ${F.gente.filter(x => x.escolhido).length} do FAT. Os operadores entram nas vagas "a escalar" da oficina; os outros sobram sem escala e sem FAT.</p>
    <div class="rolo"><table><thead><tr><th>Papel</th><th>Mat.</th><th>Nome</th><th>Função</th><th>Gerência</th><th>Contrato</th><th>Motivo</th><th>Situação</th></tr></thead><tbody>`;
  LIVRES.forEach(x => {
    h += `<tr ${dadosLinha(x, x.sit)}><td>${x.papel === "motorista" ? "Motorista" : "Operador"}</td><td class="mono">${x.mat}</td><td class="nome">${esc(x.nome)}</td><td class="t">${esc(x.funcao)}</td>
      <td class="t">${esc(x.ger)}</td><td>${esc(x.contrato)}</td><td class="t">${esc(MOTIVO_LV[x.motivo] || x.motivo)}</td><td class="t">${esc(ROT_SIT[x.sit])}</td></tr>`;
  });
  return h + "</tbody></table></div></section>";
}
// podem ter direito: efetivos com 12 meses ou mais em que falta conferir a aposentadoria (60+) ou que não entraram
// no levantamento do FAT. Não entram na fila até o RH confirmar
function verificar() {
  if (!F.verificar.length) return "";
  let h = `<section class="papel"><h3>Podem ter direito<small>conferir antes · ${F.verificar.length} pessoas</small></h3>
    <p class="nota">Efetivos com 12 meses ou mais que ainda não entram na fila: falta confirmar se são aposentados (60 anos ou mais) ou não constam no levantamento do FAT. Confirmado o direito, entram para fechar a necessidade.</p>
    <div class="rolo"><table><thead><tr><th>Papel</th><th>Mat.</th><th>Nome</th><th>Função</th><th>Atividade</th><th>O que conferir</th>
    <th class="c">Admissão</th><th class="c">Tempo</th><th class="n">Idade</th><th>Férias</th><th class="c">Limite férias</th></tr></thead><tbody>`;
  F.verificar.forEach(x => {
    h += `<tr ${dadosLinha(x, "conferir")}><td>${x.papel === "motorista" ? "Motorista" : "Operador"}</td><td class="mono">${x.mat}</td><td class="nome">${esc(x.nome)}</td><td>${esc(x.funcao)}</td>
      <td>${esc(x.ativ)}</td><td>${/Aposentadoria/.test(x.motivo) ? "Aposentadoria (60+)" : "Fora do levantamento"}</td><td class="c mono">${dataBR(x.adm)}</td>
      <td class="c">${esc(x.tempo)}</td><td class="n">${x.idade == null ? "–" : x.idade}</td><td>${esc(x.ferias)}</td><td class="c mono">${dataBR(x.limite)}</td></tr>`;
  });
  return h + "</tbody></table></div></section>";
}
// marca as caixas e as linhas sem redesenhar a tabela (não perde a rolagem nem a busca)
function marcaLinhas() {
  F.gente.forEach(x => {
    const tr = document.querySelector(`tr[data-mat="${x.mat}"]`); if (!tr) return;
    const v = vai(x);
    tr.dataset.sit = sitDe(x);
    const o = origDe(x), t = tr.querySelector(".orig");
    tr.dataset.orig = o;
    tr.classList.toggle("vai", v); tr.classList.toggle("sug", o === "sug");
    t.hidden = o === "nao"; t.className = "orig " + o; t.textContent = o === "esc" ? "escolhido" : "sugerido";
    tr.querySelector("input").checked = v;
    tr.querySelector(".troca").hidden = v === SUG.has(x.mat);
    tr.querySelector(".fe-c").innerHTML = feriasTag(x, v);
  });
}
// filtros, como os do Excel: a busca aceita vários nomes ou matrículas separados por vírgula (sem acento também acha);
// cada lista mostra só os valores que ainda aparecem com os outros filtros, com quantos são
// a turma vem das férias de cada um (turma 1 vai direto; turma 2 tira as férias e depois vai), marcado ou não
const FILTROS = ["papel", "orig", "turma", "sit", "ativ", "ger", "func", "fer"];
const ROT_TURMA = () => ({ 1: "Com férias antes do FAT", 2: "Sem férias a tirar", "–": "Sem dado · a conferir" });
const ROT_SIT = { t1: "Vai · férias e FAT", t2: "Vai · sem férias a tirar", fica: "Fica · tem direito", conferir: "Pode ter direito · conferir",
  vai: "Vão para o FAT", direito: "Com direito ao FAT", ficam: "Com direito que ficam", semfat: "Sobram sem escala e sem FAT",
  livre: "Sobra · sem escala e sem FAT", oficina: "Entra na vaga da oficina" };
// situações que juntam outras, como nas colunas da tabela por papel
const SIT_GRUPO = { vai: ["t1", "t2"], direito: ["t1", "t2", "fica"], ficam: ["fica"], semfat: ["livre"] };
const ROT_PAPEL1 = { operador: "Operador", motorista: "Motorista" };
const SEL = {};
const ROT_ORIG = { esc: "Na programação do Transporte", sug: "Marcado além da programação", nao: "Não vai" };
const rotulo = (k, v) => k === "orig" ? ROT_ORIG[v] || v : k === "sit" ? ROT_SIT[v] || v : k === "papel" ? ROT_PAPEL1[v] || v : k === "turma" ? ROT_TURMA()[v] || v : v;
const termos = () => semAcento($("busca").value).split(/[,;]/).map(t => t.trim()).filter(Boolean);
const casa = (k, v) => k === "sit" && SIT_GRUPO[SEL.sit] ? SIT_GRUPO[SEL.sit].indexOf(v) >= 0 : v === SEL[k];
function passa(tr, ignora, q) {
  if (q.length && !q.some(t => tr.dataset.b.indexOf(t) >= 0)) return false;
  return FILTROS.every(k => k === ignora || !SEL[k] || casa(k, tr.dataset[k]));
}
// o número da tabela fica aceso quando a lista mostra exatamente ele (só papel e situação, sem outro filtro)
const ORIG_BOT = { esc: 1, sug: 1 };
function marcaBotoes() {
  const so = !termos().length && FILTROS.every(k => k === "papel" || k === "sit" || !SEL[k]);
  const so2 = !termos().length && FILTROS.every(k => k === "papel" || k === "orig" || !SEL[k]);
  document.querySelectorAll("button.nb").forEach(b => b.classList.toggle("on", ORIG_BOT[b.dataset.s]
    ? so2 && SEL.orig === b.dataset.s && (SEL.papel || "") === b.dataset.p
    : so && !SEL.orig && SEL.sit === b.dataset.s && (SEL.papel || "") === b.dataset.p));
}
function filtra() {
  const linhas = [...document.querySelectorAll("tr[data-b]")], q = termos();
  let n = 0;
  linhas.forEach(tr => { const ok = passa(tr, null, q); tr.hidden = !ok; if (ok) n++; });
  // título de grupo e quadro sem ninguém na tela somem
  document.querySelectorAll("tr.grp").forEach(g => {
    let t = g.nextElementSibling, vis = false;
    while (t && !t.classList.contains("grp")) { if (!t.hidden) { vis = true; break; } t = t.nextElementSibling; }
    g.hidden = !vis;
  });
  document.querySelectorAll("section.papel").forEach(s => { s.hidden = !s.querySelector("tr[data-b]:not([hidden])"); });
  $("conta").textContent = n === linhas.length ? `${n} pessoas na lista` : `Mostrando ${n} de ${linhas.length} pessoas`;
  FILTROS.forEach(k => {
    const sel = $("f-" + k), cont = new Map();
    linhas.forEach(tr => { if (passa(tr, k, q)) cont.set(tr.dataset[k], (cont.get(tr.dataset[k]) || 0) + 1); });
    const grupo = k === "sit" && SIT_GRUPO[SEL.sit];
    if (SEL[k] && !grupo && !cont.has(SEL[k])) cont.set(SEL[k], 0);
    const tot = [...cont.values()].reduce((a, b) => a + b, 0);
    const vals = [...cont.keys()].sort((a, b) => rotulo(k, a).localeCompare(rotulo(k, b), "pt-BR"));
    const opt = (v, n) => `<option value="${esc(v)}"${v === SEL[k] ? " selected" : ""}>${esc(rotulo(k, v))} (${n})</option>`;
    sel.innerHTML = `<option value="">Todos (${tot})</option>` + vals.map(v => opt(v, cont.get(v))).join("") +
      (k === "sit" ? `<optgroup label="Colunas da tabela">${Object.keys(SIT_GRUPO).map(g => opt(g, SIT_GRUPO[g].reduce((a, s) => a + (cont.get(s) || 0), 0))).join("")}</optgroup>` : "");
    sel.classList.toggle("ativo", !!SEL[k]);
  });
  marcaBotoes();
}
// pessoas (com direito e a conferir) pela matrícula, para copiar o que está na tela
const PESSOA = new Map(F.gente.concat(F.verificar, LIVRES).map(x => [String(x.mat), x]));
function copia(linhas, rotuloOk) {
  const txt = linhas.join("\n"), n = linhas.length - 1;
  const mostra = () => { const t = $("copia"); t.hidden = false; t.value = txt; t.focus(); t.select();
    $("aviso").textContent = `Não deu para copiar sozinho: selecione o texto abaixo (${n} pessoas) e copie.`; };
  try {
    navigator.clipboard.writeText(txt).then(() => { $("copia").hidden = true; $("aviso").textContent = `${n} pessoas ${rotuloOk}: cole no Excel.`; }, mostra);
  } catch (e) { mostra(); }
}

$("listas").addEventListener("change", e => {
  const c = e.target.closest("input[data-mat]"); if (!c) return;
  const mat = +c.dataset.mat;
  if (c.checked === SUG.has(mat)) delete marcas[mat]; else marcas[mat] = c.checked;
  grava(CH_M, marcas); marcaLinhas(); resumo(); filtra();
});
$("resumo").addEventListener("change", e => {
  const i = e.target.closest("input[data-p]"); if (!i) return;
  nec[i.dataset.p] = Math.max(0, parseInt(i.value, 10) || 0);
  grava(CH_N, nec); SUG = sugeridos(); marcaLinhas(); resumo(); filtra();
  const o = $("nec-" + i.dataset.p); if (o) o.focus();
});
$("busca").addEventListener("input", filtra);
// clique num número da tabela: a lista mostra só aquelas pessoas (de novo no mesmo número, volta tudo)
$("resumo").addEventListener("click", e => {
  const b = e.target.closest("button.nb"); if (!b) return;
  const ja = b.classList.contains("on");
  FILTROS.forEach(k => { SEL[k] = ""; }); $("busca").value = "";
  if (!ja) { SEL.papel = b.dataset.p; SEL[ORIG_BOT[b.dataset.s] ? "orig" : "sit"] = b.dataset.s; }
  filtra();
  $("aviso").textContent = ja ? "Filtro limpo." : b.dataset.s === "semfat"
    ? "Quem sobra sem escala e sem FAT: não está na escala de dezembro nem no FAT (relatório de ativos do Transporte), com o motivo de cada um."
    : "";
  if (!ja) document.querySelector(".filtros").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
});
document.querySelector(".filtros").addEventListener("change", e => {
  const s = e.target.closest("select[data-k]"); if (!s) return;
  SEL[s.dataset.k] = s.value; filtra();
});
$("bLimpa").addEventListener("click", () => {
  FILTROS.forEach(k => { SEL[k] = ""; }); $("busca").value = ""; filtra(); $("aviso").textContent = "Filtros limpos.";
});
$("bSug").addEventListener("click", () => {
  marcas = {}; Object.assign(nec, NEC_BASE); grava(CH_M, marcas); grava(CH_N, nec);
  SUG = sugeridos(); marcaLinhas(); resumo(); filtra(); $("aviso").textContent = "Voltou à sugestão.";
});
// o que está na tela depois dos filtros, em colunas separadas por tabulação
$("bCopiaF").addEventListener("click", () => {
  const vis = [...document.querySelectorAll("tr[data-b]:not([hidden])")];
  copia([["Papel", "Mat.", "Nome", "Função", "Atividade", "Gerência", "Admissão", "Férias", "Limite férias", "Turma", "Situação"].join("\t")]
    .concat(vis.map(tr => { const x = PESSOA.get(tr.dataset.mat);
      return [ROT[x.papel], x.mat, x.nome, x.funcao, x.ativ, x.ger || "–", dataBR(x.adm), x.ferias, dataBR(x.limite), rotulo("turma", tr.dataset.turma), ROT_SIT[tr.dataset.sit]].join("\t"); })), "copiadas da lista filtrada");
});
// exportar para Excel: a lista que está na tela (com os filtros), uma linha por pessoa, com turma, situação e férias.
// A biblioteca da planilha só carrega no clique; sem ela (sem internet), sai um CSV que o Excel abre igual
const ROT_FILTRO = { papel: "Papel", orig: "Escolha", turma: "Turma", sit: "Situação", ativ: "Atividade", ger: "Gerência", func: "Função", fer: "Férias" };
const filtrosTexto = () => FILTROS.filter(k => SEL[k]).map(k => `${ROT_FILTRO[k]}: ${rotulo(k, SEL[k])}`)
  .concat(termos().length ? [`Busca: ${$("busca").value.trim()}`] : []).join(" · ") || "Sem filtro";
function filtradas() {
  const cab = ["Papel", "Mat.", "Nome", "Função", "Atividade", "Gerência", "Admissão", "Tempo", "Idade", "Férias", "Limite férias",
    "Fonte do limite", "Escolha", "Turma", "Situação", "Período da turma", "Alerta", "Programado"];
  const vis = [...document.querySelectorAll("tr[data-b]:not([hidden])")];
  return [cab].concat(vis.map(tr => { const x = PESSOA.get(tr.dataset.mat), v = tr.dataset.sit === "t1" || tr.dataset.sit === "t2";
    return [ROT_PAPEL1[x.papel], +x.mat, x.nome, x.funcao, x.ativ, x.ger || "–", dataBR(x.adm), x.tempo || "", x.idade == null ? "" : x.idade,
      x.ferias || "", dataBR(x.limite), x.fonte_ferias || "painel", ROT_ORIG[tr.dataset.orig] || "", rotulo("turma", tr.dataset.turma), ROT_SIT[tr.dataset.sit] || "",
      v ? textoTurma(x) : "", x.alerta || "", x.prog || ""]; }));
}
const nomeArq = ext => "FAT_lista_" + new Date().toISOString().slice(0, 10) + "." + ext;
function baixa(blob, nome) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function csv(linhas) {
  const cel = v => { const t = String(v); return /[;"\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  baixa(new Blob(["﻿" + linhas.map(l => l.map(cel).join(";")).join("\r\n")], { type: "text/csv;charset=utf-8" }), nomeArq("csv"));
}
let carregaXlsx = null;
$("bXls").addEventListener("click", () => {
  const linhas = filtradas(), n = linhas.length - 1;
  carregaXlsx = carregaXlsx || new Promise((ok, erro) => {
    if (window.XLSX) return ok();
    const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload = ok; s.onerror = erro; document.head.appendChild(s);
  });
  carregaXlsx.then(() => {
    const ws = XLSX.utils.aoa_to_sheet([["Lista nominal do FAT · " + filtrosTexto()], []].concat(linhas));
    ws["!cols"] = linhas[0].map((c, i) => ({ wch: Math.min(48, Math.max(c.length, ...linhas.slice(1).map(l => String(l[i]).length)) + 2) }));
    ws["!autofilter"] = { ref: XLSX.utils.encode_range({ s: { r: 2, c: 0 }, e: { r: 2 + n, c: linhas[0].length - 1 } }) };
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "FAT");
    XLSX.writeFile(wb, nomeArq("xlsx"));
    $("aviso").textContent = `${n} pessoas exportadas para o Excel.`;
  }, () => { carregaXlsx = null; csv(linhas); $("aviso").textContent = `${n} pessoas exportadas em CSV (abre no Excel).`; });
});
// imprimir ou salvar em PDF: sai o que está na tela, com os filtros escritos no alto da folha
$("bImp").addEventListener("click", () => {
  const n = document.querySelectorAll("tr[data-b]:not([hidden])").length;
  $("impFiltro").textContent = `${filtrosTexto()} · ${n} pessoas · impresso em ${new Date().toLocaleDateString("pt-BR")}`;
  print();
});
// os marcados, em colunas separadas por tabulação: colam direto no Excel
$("bCopia").addEventListener("click", () => {
  copia([["Papel", "Mat.", "Nome", "Função", "Atividade", "Gerência", "Admissão", "Limite férias", "Escolha", "Turma", "Alerta", "Programado"].join("\t")]
    .concat(F.gente.filter(vai).map(x => [ROT[x.papel], x.mat, x.nome, x.funcao, x.ativ, x.ger, dataBR(x.adm), dataBR(x.limite), ROT_ORIG[origDe(x)], textoTurma(x), x.alerta || "", x.prog || ""].join("\t"))), "marcadas copiadas");
});

resumo(); listas(); marcaLinhas(); filtra();
})();
</script>
